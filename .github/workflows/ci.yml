name: CI

"on":
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test-train-docker:
    runs-on: ubuntu-latest

    env:
      DOCKER_NAMESPACE: "2024aa05086"
      IMAGE_NAME: "heart-disease-api"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Sanity check import
        run: |
          python -c "import src; import src.train; print('Import OK')"

      - name: Run unit tests
        run: |
          pytest -q

      - name: Train model
        run: |
          python -m src.train \
            --data-path data/heart.csv \
            --output-dir models

      # Login to Docker Hub
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build + tag image (latest + commit SHA)
      - name: Build Docker image
        run: |
          IMAGE="${DOCKER_NAMESPACE}/${IMAGE_NAME}"
          TAG_SHA="${GITHUB_SHA::7}"

          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${TAG_SHA}" .

      # Push both tags
      - name: Push Docker image
        run: |
          IMAGE="${DOCKER_NAMESPACE}/${IMAGE_NAME}"
          TAG_SHA="${GITHUB_SHA::7}"

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${TAG_SHA}"

      - name: Archive model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/**
            models/metrics.json
