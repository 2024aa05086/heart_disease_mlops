name: CI

"on":
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔍 Print structure so we KNOW where the package is
      - name: Debug repo structure
        run: |
          pwd
          ls -la
          echo "---- find train.py ----"
          find . -maxdepth 5 -type f -name "train.py" -print
          echo "---- find heart_disease_mlops dirs ----"
          find . -maxdepth 4 -type d -name "heart_disease_mlops" -print
          echo "---- find __init__.py ----"
          find . -maxdepth 6 -type f -name "__init__.py" -print

      # ✅ Cover both layouts:
      # - repo root contains heart_disease_mlops/
      # - src/heart_disease_mlops/
      # - heart_disease_mlops/heart_disease_mlops/ (double nested)
      - name: Set PYTHONPATH (robust)
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/heart_disease_mlops" >> $GITHUB_ENV

      - name: Sanity check package import
        run: |
          python -c "import sys; print('PYTHONPATH=', __import__('os').environ.get('PYTHONPATH')); print(sys.path)"
          python -c "import heart_disease_mlops; print('heart_disease_mlops imported from:', heart_disease_mlops.__file__)"
          python -c "import heart_disease_mlops.src.train; print('Import OK')"

      - name: Run unit tests
        run: |
          pytest -q

      - name: Train model
        run: |
          python -m heart_disease_mlops.src.train \
            --data-path heart_disease_mlops/data/heart.csv \
            --output-dir heart_disease_mlops/models

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            heart_disease_mlops/models/**
