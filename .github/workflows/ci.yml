name: CI

"on":
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Ensure repo root is importable (makes `heart_disease_mlops` discoverable)
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      # ✅ Quick sanity check to fail early with a clear error
      - name: Sanity check package import
        run: |
          python -c "import sys; print(sys.path)"
          python -c "import heart_disease_mlops; import heart_disease_mlops.src.train; print('Import OK')"

      - name: Run unit tests
        run: |
          pytest -q

      - name: Train model
        run: |
          python -m heart_disease_mlops.src.train \
            --data-path heart_disease_mlops/data/heart.csv \
            --output-dir heart_disease_mlops/models

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            heart_disease_mlops/models/**