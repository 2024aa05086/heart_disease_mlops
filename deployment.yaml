
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-disease
  template:
    metadata:
      labels:
        app: heart-disease
    spec:
      containers:
      - name: api
        image: heart-disease-api
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-service
spec:
  type: NodePort
  selector:
    app: heart-disease
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30007
